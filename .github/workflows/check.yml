name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or later
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          if [ -z "$xcode" ]; then
            echo 'Xcode 26+ is required for the native Liquid Glass build.' >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
      - run: ./scripts/check.sh
      - run: ./scripts/build-app.sh
      - name: Preserve the app bundle's executable permissions
        run: ditto -c -k --keepParent "build/BalanceEQ.app" build/BalanceEQ-local.zip
      - uses: actions/upload-artifact@v4
        with:
          name: local-build-unnotarized
          path: build/BalanceEQ-local.zip
